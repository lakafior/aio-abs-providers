<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backbone · Settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
      --accent: #2563eb; --accent-text: #ffffff; --field: #ffffff; --ok: #15803d; --bad: #b91c1c;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --surface: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2; --line: #2e2e33;
        --accent: #5b8cff; --accent-text: #0b0b0d; --field: #232327; --ok: #4ade80; --bad: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 96px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .note { color: var(--muted); font-size: 13px; margin: 0; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .provider.off .fields { opacity: .45; }
    .provider-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .provider-head h3 { margin: 0; font-size: 16px; }
    .provider-head small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
    .field > span { font-size: 12px; color: var(--muted); }
    input[type="number"], input[type="text"], select, textarea {
      width: 100%; padding: 7px 9px; font: inherit; color: var(--text); background: var(--field);
      border: 1px solid var(--line); border-radius: 8px; min-width: 0;
    }
    textarea { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    details .fields { margin-top: 10px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 24px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
    .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
    .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
    .switch input:checked + i { background: var(--accent); }
    .switch input:checked + i::after { transform: translateX(16px); }
    .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .rows .row:last-child { padding-bottom: 0; }
    .row .label { min-width: 0; }
    .row .label b { font-weight: 500; display: block; }
    .row .label small { color: var(--muted); font-size: 12px; }
    .row .control { display: flex; align-items: center; gap: 10px; flex: none; }
    .row input[type="range"] { width: 180px; accent-color: var(--accent); }
    .row input[type="number"] { width: 110px; }
    .row output { min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .prefs { display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 4px; }
    .prefs.disabled { opacity: .45; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
    .bar-inner { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button:hover { filter: brightness(0.96); }
    #status { margin-left: 6px; font-size: 13px; color: var(--ok); }
    #status.error { color: var(--bad); }
    #previewResult { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; }
    @media (max-width: 560px) {
      .row { flex-direction: column; align-items: stretch; gap: 8px; }
      .row .control { justify-content: space-between; }
      .row input[type="range"] { flex: 1; width: auto; }
      .row output { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Settings</h1>
      <a id="searchLink" href="/search-ui">Search →</a>
    </header>
    <p class="note">Anyone who can open this page can change the config. Set <code>API_KEY</code> when the port is reachable by others.</p>

    <h2>Sources</h2>
    <div id="providers" class="grid"></div>

    <h2>Search</h2>
    <div class="card rows">
      <label class="row"><span class="label"><b>Audiobooks</b><small>Return audiobooks</small></span>
        <span class="control"><span class="switch"><input id="global_allowAudiobooks" type="checkbox"><i></i></span></span></label>
      <label class="row"><span class="label"><b>Books</b><small>Return printed books and ebooks</small></span>
        <span class="control"><span class="switch"><input id="global_allowBooks" type="checkbox"><i></i></span></span></label>
      <label class="row"><span class="label"><b>Title / author balance</b><small>How much the title counts when an author is given</small></span>
        <span class="control"><input id="global_titleWeight" type="range" min="0" max="100" value="60"><output id="titleWeightLabel"></output></span></label>
      <label class="row"><span class="label"><b>Similarity threshold</b><small>Results scoring lower are dropped</small></span>
        <span class="control"><input id="global_similarityThreshold" type="range" min="0" max="100" value="30"><output id="similarityThresholdLabel"></output></span></label>
      <label class="row"><span class="label"><b>Search time limit (ms)</b><small>Slower sources are left out; Audiobookshelf waits 10000</small></span>
        <span class="control"><input id="global_searchTimeoutMs" type="number" min="1000" max="60000" step="500"></span></label>
      <label class="row"><span class="label"><b>Sources asked at once</b></span>
        <span class="control"><input id="global_maxProvidersParallel" type="number" min="1"></span></label>
    </div>

    <h2>Merging</h2>
    <div class="card">
      <label class="row"><span class="label"><b>Merge best results</b><small>Put one combined result first, built from the same title, author and kind across sources</small></span>
        <span class="control"><span class="switch"><input id="global_mergeBestResults" type="checkbox"><i></i></span></span></label>
      <div class="row"><span class="label"><b>Take each field from</b><small>"automatic" = the source with the highest priority that has it</small></span></div>
      <div id="mergePrefs" class="prefs"></div>
      <details>
        <summary>Order of sources for equal results</summary>
        <ol id="previewResult"></ol>
      </details>
    </div>
  </div>

  <div class="bar"><div class="bar-inner">
    <button id="save" class="primary">Save</button>
    <button id="reload">Reload</button>
    <span id="status" role="status"></span>
  </div></div>

  <script>
    // With API_KEY set on the server, open this page as ...?key=<key>; the key goes along to the API.
    const pageKey = new URLSearchParams(location.search).get('key');
    const withKey = (url) => pageKey ? url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(pageKey) : url;
    document.getElementById('searchLink').href = withKey('/search-ui');

    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      for (const child of [].concat(children)) node.append(child);
      return node;
    };
    const PREF_FIELDS = ['title','subtitle','authors','narrator','description','cover','isbn','asin','duration','publishedYear','rating','url','source','identifiers','publisher','series','seriesIndex','language','genres','tags'];

    let currentConfig = null;

    function setStatus(msg, isError = false) {
      const s = $('status');
      s.textContent = msg;
      s.classList.toggle('error', isError);
    }

    function field(label, control, extraClass = '') {
      return el('label', { className: 'field ' + extraClass }, [el('span', { textContent: label }), control]);
    }

    function numberInput(key, value, min) {
      const input = el('input', { type: 'number', min, value });
      input.dataset.key = key;
      return input;
    }

    function renderProvider(name, cfg, meta = {}) {
      const card = el('div', { className: 'card provider' });
      card.dataset.name = name;

      const enabled = el('input', { type: 'checkbox', checked: !!cfg.enabled });
      enabled.dataset.key = 'enabled';
      const sync = () => card.classList.toggle('off', !enabled.checked);
      enabled.addEventListener('change', () => { sync(); renderPreview(); });
      sync();

      const kinds = (meta.kinds || []).map((k) => (k === 'book' ? 'books' : 'audiobooks')).join(' and ');
      card.append(el('div', { className: 'provider-head' }, [
        el('h3', {}, [meta.label || name, el('small', { textContent: kinds })]),
        el('span', { className: 'switch', title: 'Enabled' }, [enabled, el('i')]),
      ]));

      const language = el('select', { title: meta.languageMeaning || '' });
      language.dataset.key = 'language';
      const codes = (meta.supportedLanguages || []).slice();
      if (cfg.language && !codes.includes(cfg.language)) codes.push(cfg.language);
      for (const code of codes) language.append(el('option', { value: code, textContent: code }));
      language.value = cfg.language || '';

      const priority = numberInput('priority', typeof cfg.priority === 'number' ? cfg.priority : 0, 0);
      priority.addEventListener('input', renderPreview);

      card.append(el('div', { className: 'fields' }, [
        field('Language / store', language),
        field('Priority', priority),
        field('Max results (0 = all)', numberInput('maxResults', typeof cfg.maxResults === 'number' ? cfg.maxResults : 0, 0), 'wide'),
      ]));

      const advanced = el('div', { className: 'fields' }, [
        field('Detail pages at once', numberInput('concurrency', cfg.concurrency || 1, 1)),
        field('Request timeout (ms)', numberInput('timeoutMs', cfg.timeoutMs || 10000, 100)),
      ]);
      // Extras: provider-specific typed inputs when possible
      if (name === 'audioteka') {
        const chk = el('input', { type: 'checkbox', checked: !!(cfg.extra && cfg.extra.addLinkToDescription) });
        chk.dataset.key = 'extra.addLinkToDescription';
        advanced.append(field('Start the description with a link to Audioteka', el('span', { className: 'switch' }, [chk, el('i')]), 'wide inline'));
      } else {
        const ta = el('textarea', { rows: 2, value: JSON.stringify(cfg.extra || {}, null, 2) });
        ta.dataset.key = 'extra';
        advanced.append(field('Extra (JSON)', ta, 'wide'));
      }
      card.append(el('details', {}, [el('summary', { textContent: 'Advanced' }), advanced]));
      return card;
    }

    function renderGlobal(cfg) {
      const g = cfg.global || {};
      $('global_maxProvidersParallel').value = g.maxProvidersParallel || 3;
      $('global_searchTimeoutMs').value = typeof g.searchTimeoutMs === 'number' ? g.searchTimeoutMs : 9000;
      $('global_allowBooks').checked = typeof g.allowBooks !== 'undefined' ? !!g.allowBooks : true;
      $('global_allowAudiobooks').checked = typeof g.allowAudiobooks !== 'undefined' ? !!g.allowAudiobooks : true;
      $('global_titleWeight').value = typeof g.titleWeight === 'number' ? g.titleWeight : 60;
      $('global_similarityThreshold').value = typeof g.similarityThreshold === 'number' ? g.similarityThreshold : 30;
      $('global_mergeBestResults').checked = !!g.mergeBestResults;

      const mergePrefs = g.mergePreferences || {};
      const providersList = Object.keys(cfg.providers || {});
      const container = $('mergePrefs');
      container.replaceChildren();
      for (const f of PREF_FIELDS) {
        const sel = el('select');
        sel.dataset.key = 'mergePref.' + f;
        sel.append(el('option', { value: '', textContent: 'automatic' }));
        for (const p of providersList) sel.append(el('option', { value: p, textContent: p }));
        sel.value = mergePrefs[f] || '';
        container.append(field(f, sel));
      }
      updateLabels();
    }

    function updateLabels() {
      const w = parseInt($('global_titleWeight').value, 10) || 0;
      $('titleWeightLabel').textContent = `title ${w}% · author ${100 - w}%`;
      $('similarityThresholdLabel').textContent = `at least ${parseInt($('global_similarityThreshold').value, 10) || 0}%`;
      $('mergePrefs').classList.toggle('disabled', !$('global_mergeBestResults').checked);
    }
    for (const id of ['global_titleWeight', 'global_similarityThreshold']) $(id).addEventListener('input', updateLabels);
    $('global_mergeBestResults').addEventListener('change', updateLabels);

    // Results with the same score: audiobooks first, then the source with the higher priority.
    function renderPreview() {
      const cards = Array.from($('providers').children).filter((c) => c.querySelector('[data-key="enabled"]').checked);
      const rows = cards.map((c) => ({ name: c.dataset.name, priority: parseInt(c.querySelector('[data-key="priority"]').value, 10) || 0 }))
        .sort((a, b) => b.priority - a.priority);
      $('previewResult').replaceChildren(...rows.map((r) => el('li', { textContent: `${r.name} (priority ${r.priority})` })));
    }

    function renderConfig(cfg, meta = []) {
      currentConfig = cfg;
      const container = $('providers');
      container.replaceChildren();
      for (const [name, p] of Object.entries(cfg.providers || {})) {
        container.append(renderProvider(name, p, meta.find((m) => m.name === name) || {}));
      }
      renderGlobal(cfg);
      renderPreview();
    }

    async function fetchMeta() {
      try {
        const r = await fetch(withKey('/admin/providers/meta'));
        return r.ok ? await r.json() : [];
      } catch (e) {
        return [];
      }
    }

    async function loadAndRender() {
      setStatus('Loading…');
      const res = await fetch(withKey('/admin/config'));
      if (!res.ok) return setStatus('Failed to load config: ' + (res.status === 401 ? 'API key required (open as /admin?key=…)' : res.statusText), true);
      renderConfig(await res.json(), await fetchMeta());
      setStatus('');
    }

    $('reload').addEventListener('click', loadAndRender);

    $('save').addEventListener('click', async () => {
      if (!currentConfig) return setStatus('No config loaded', true);
      const int = (node, fallback) => { const v = parseInt(node.value, 10); return Number.isNaN(v) ? fallback : v; };
      // Start from the loaded global section: it has settings this form does not show.
      const newCfg = { providers: {}, global: { ...(currentConfig.global || {}) } };
      for (const card of $('providers').children) {
        const name = card.dataset.name;
        const q = (key) => card.querySelector(`[data-key="${key}"]`);
        let extra = {};
        if (name === 'audioteka') {
          extra.addLinkToDescription = q('extra.addLinkToDescription').checked;
        } else {
          try { extra = JSON.parse(q('extra').value || '{}'); } catch (e) { return setStatus('Invalid JSON in extra for ' + name, true); }
        }
        newCfg.providers[name] = {
          enabled: q('enabled').checked,
          priority: int(q('priority'), 0),
          language: q('language').value.trim(),
          concurrency: int(q('concurrency'), 1) || 1,
          timeoutMs: int(q('timeoutMs'), 10000) || 10000,
          maxResults: int(q('maxResults'), 0),
          extra,
        };
      }
      newCfg.global.maxProvidersParallel = int($('global_maxProvidersParallel'), 3) || 3;
      newCfg.global.searchTimeoutMs = int($('global_searchTimeoutMs'), 9000);
      newCfg.global.allowBooks = $('global_allowBooks').checked;
      newCfg.global.allowAudiobooks = $('global_allowAudiobooks').checked;
      // 0 is a valid value for both sliders.
      newCfg.global.titleWeight = int($('global_titleWeight'), 60);
      newCfg.global.similarityThreshold = int($('global_similarityThreshold'), 30);
      newCfg.global.mergeBestResults = $('global_mergeBestResults').checked;
      newCfg.global.mergePreferences = {};
      for (const f of PREF_FIELDS) {
        const sel = document.querySelector('[data-key="mergePref.' + f + '"]');
        if (sel) newCfg.global.mergePreferences[f] = sel.value || null;
      }

      setStatus('Saving…');
      const res = await fetch(withKey('/admin/config'), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newCfg) });
      if (!res.ok) {
        let err = null;
        try { err = await res.json(); } catch (e) { /* ignore */ }
        return setStatus('Save failed: ' + ((err && err.error) || res.statusText), true);
      }
      const body = await res.json();
      renderConfig(body.config || newCfg, await fetchMeta());
      setStatus('Saved ✓');
    });

    loadAndRender();
  </script>
</body>
</html>
